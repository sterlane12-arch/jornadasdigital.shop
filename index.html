<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Continuar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(circle at top, #ffffff 0%, #f4f6f9 45%, #e9edf2 100%);
    color: #202124;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

/* Fundo decorativo */
.bg-circle {
    position: fixed;
    border-radius: 50%;
    filter: blur(2px);
    opacity: .45;
    pointer-events: none;
}

.circle-1 {
    width: 250px;
    height: 250px;
    background: #dcecff;
    top: -80px;
    left: -80px;
}

.circle-2 {
    width: 300px;
    height: 300px;
    background: #e8ddff;
    right: -100px;
    bottom: -100px;
}

/* CARD */
.container {
    width: calc(100% - 32px);
    max-width: 430px;
    position: relative;
    z-index: 2;
}

.card {
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(0,0,0,.07);
    border-radius: 24px;
    padding: 30px 22px;
    text-align: center;
    box-shadow:
        0 20px 60px rgba(0,0,0,.10),
        0 4px 15px rgba(0,0,0,.05);
    backdrop-filter: blur(12px);
}

/* ÍCONE */
.icon {
    width: 68px;
    height: 68px;
    margin: 0 auto 18px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f5f9;
    font-size: 31px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
}

h1 {
    font-size: 25px;
    line-height: 1.2;
    margin-bottom: 10px;
}

.description {
    color: #687078;
    font-size: 15px;
    line-height: 1.55;
    margin-bottom: 24px;
}

/* ÁREA DE VERIFICAÇÃO */
.verify-box {
    border: 1px solid #dfe3e7;
    background: #fafafa;
    border-radius: 14px;
    padding: 14px;
    text-align: left;
}

.verify-content {
    display: flex;
    align-items: center;
    gap: 13px;
}

.check {
    width: 27px;
    height: 27px;
    border: 2px solid #b8bec5;
    border-radius: 6px;
    background: white;
    flex-shrink: 0;
    position: relative;
    transition: .3s ease;
}

.check.active {
    background: #22c55e;
    border-color: #22c55e;
}

.check.active::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 13px;
    border-right: 3px solid white;
    border-bottom: 3px solid white;
    transform: rotate(45deg);
    left: 8px;
    top: 4px;
}

.verify-text strong {
    display: block;
    font-size: 14px;
    margin-bottom: 3px;
}

.verify-text span {
    font-size: 12px;
    color: #737a81;
}

/* BOTÃO */
.continue-btn {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 13px;
    padding: 16px;
    background: #111827;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: .25s ease;
    box-shadow: 0 8px 20px rgba(17,24,39,.18);
}

.continue-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(17,24,39,.25);
}

.continue-btn:active {
    transform: scale(.98);
}

/* RODAPÉ */
.footer {
    margin-top: 18px;
    color: #8a929a;
    font-size: 11px;
}

/* BOTÃO FLUTUANTE */
.floating {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 10;
    background: white;
    border: 1px solid #dfe3e7;
    border-radius: 14px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    box-shadow: 0 8px 25px rgba(0,0,0,.16);
    cursor: pointer;
    animation: float 3s ease-in-out infinite;
}

.floating-check {
    width: 25px;
    height: 25px;
    border: 2px solid #b7bdc3;
    border-radius: 5px;
    background: #fff;
    transition: .3s;
}

.floating-text {
    font-size: 11px;
    color: #444;
}

.floating-text strong {
    display: block;
    font-size: 12px;
    color: #222;
}

.floating-logo {
    font-size: 9px;
    color: #999;
    margin-left: 3px;
}

.floating.active .floating-check {
    background: #22c55e;
    border-color: #22c55e;
}

.floating.active .floating-check::after {
    content: "✓";
    color: white;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

/* LOADING */
.loading {
    display: none;
    margin-top: 15px;
    font-size: 13px;
    color: #69717a;
}

.spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #ddd;
    border-top-color: #111827;
    border-radius: 50%;
    vertical-align: -3px;
    margin-right: 5px;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* MOBILE */
@media (max-width: 480px) {

    .container {
        width: calc(100% - 22px);
    }

    .card {
        padding: 26px 17px;
        border-radius: 21px;
    }

    h1 {
        font-size: 23px;
    }

    .floating {
        right: 12px;
        bottom: 12px;
    }
}
</style>
</head>

<body>

<div class="bg-circle circle-1"></div>
<div class="bg-circle circle-2"></div>

<main class="container">

    <section class="card">

        <div class="icon">
            ✓
        </div>

        <h1>Pronto para continuar?</h1>

        <p class="description">
            Faça a confirmação abaixo para acessar o próximo conteúdo.
        </p>

        <div class="verify-box">

            <div class="verify-content">

                <div class="check" id="check"></div>

                <div class="verify-text">
                    <strong>Confirmar acesso</strong>
                    <span>Clique para continuar</span>
                </div>

            </div>

        </div>

        <button class="continue-btn" id="continueBtn">
            Continuar
        </button>

        <div class="loading" id="loading">
            <span class="spinner"></span>
            Redirecionando...
        </div>

        <div class="footer">
            Você será direcionado para o próximo conteúdo.
        </div>

    </section>

</main>


<!-- BOTÃO FLUTUANTE -->
<div class="floating" id="floating">

    <div class="floating-check"></div>

    <div class="floating-text">
        <strong>Continuar</strong>
        Confirmação de acesso
    </div>

</div>


<script>

const check = document.getElementById("check");
const floating = document.getElementById("floating");
const button = document.getElementById("continueBtn");
const loading = document.getElementById("loading");

/* COLOQUE SEU LINK AQUI */
const DESTINO = "https://elegant-desenrola.netlify.ap";


function continuar() {

    check.classList.add("active");
    floating.classList.add("active");

    loading.style.display = "block";

    button.disabled = true;
    button.style.opacity = "0.7";

    setTimeout(() => {

        window.location.href = DESTINO;

    }, 700);
}


/* Clique no botão principal */
button.addEventListener("click", continuar);


/* Clique no botão flutuante */
floating.addEventListener("click", continuar);

</script>

</body>
</html>
